<html>
  <head>
    <title>BibTeXFromURL Options</title>
    <style>
      #optionsForm label {
        display: block;
        margin-bottom: 10px; /* Optional for spacing */
      }
    </style>
  </head>
  <body>
    <script defer src="options.js" type="module"></script>
    <form id="optionsForm">
      <label for="includeAccessDate">
        <input
          type="checkbox"
          name="includeAccessDate"
          id="includeAccessDate"
        />
        Include date accessed for the URL
      </label>
      <br />
      <label for="omitEmptyFields">
        <input type="checkbox" name="omitEmptyFields" id="omitEmptyFields" />
        Omit empty fields from generated citation
      </label>
      <br />
      <label for="noInferAuthor">
        <input type="checkbox" name="noInferAuthor" id="noInferAuthor" />
        Do not attempt to infer the author(s) from the webpage
      </label>
      <label for="noInferDate">
        <input type="checkbox" name="noInferDate" id="noInferDate" />
        Do not attempt to infer the publication date from the webpage
      </label>
      <label for="formattingStyle">
        Entry formatting style
        <select id="formattingStyle" name="formattingStyle">
          <option value="wikipedia" selected>@misc wikipedia style</option>
          <option value="misc">@misc style</option>
          <option value="online">@online style</option>
        </select>
      </label>

      <label for="dateFormat">
        Date format
        <select id="dateFormat" name="dateFormat">
          <option value="M-1">mm/dd/yyyy</option>
          <option value="M-2">mm-dd-yyyy</option>
          <option value="M-3">mm.dd.yyyy</option>
          <option value="L-1">dd/mm/yyyy</option>
          <option value="L-2">dd-mm-yyyy</option>
          <option value="L-3">dd.mm.yyyy</option>
          <option value="B-1">yyyy/mm/dd</option>
          <option value="B-2" selected>yyyy-mm-dd</option>
          <option value="B-3">yyyy.mm.dd</option>
          <option value="O-1">mm/yyyy</option>
        </select>
      </label>
    </form>
  </body>
</html>
